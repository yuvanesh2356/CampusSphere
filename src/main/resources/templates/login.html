<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container cs-auth-page">
    <div class="cs-auth-card mx-auto">
        <h2 class="cs-auth-title">Welcome back</h2>
        <p class="cs-auth-subtitle">Login with your registered college email address.</p>

        <!-- 
          th:if flags below are driven by query params that SecurityConfig
          redirects to (failureUrl="/login?error=true", logoutSuccessUrl="/login?logout=true")
        -->
        <div class="alert alert-danger" th:if="${param.error}">
            Invalid email or password. Please try again.
        </div>
        <div class="alert alert-success" th:if="${param.logout}">
            You have been logged out successfully.
        </div>

        <!-- 
          Plain HTML form posting directly to Spring Security's login
          processing URL - no JavaScript needed for this one, since
          Spring Security handles the submission, validation, and
          redirect entirely on the server side.
        -->
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">College Email</label>
                <input type="email" class="form-control" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-cs-primary w-100 mt-2">Login</button>
        </form>

        <p class="cs-auth-footer-text">New to CampusSphere? <a href="/register">Create an account</a></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
