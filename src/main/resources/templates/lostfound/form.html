<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${postId != null} ? 'Edit Post - CampusSphere' : 'Report an Item - CampusSphere'">Lost &amp; Found Form - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/lostfound.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard" style="max-width: 720px;">

    <h2 class="cs-dashboard-title" th:text="${postId != null} ? 'Edit Post' : 'Report an Item'"></h2>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="lf-form-card mt-3">
        <!--
          Same form posts to two different URLs depending on mode.
          enctype=multipart/form-data is required since this form
          carries an optional image alongside the text fields.
        -->
        <form th:action="${postId != null} ? @{'/lostfound/' + ${postId} + '/edit'} : @{/lostfound/create}"
              th:object="${postForm}" method="post" enctype="multipart/form-data" novalidate>

            <div class="mb-3">
                <label class="form-label d-block">This item is</label>
                <div class="btn-group" role="group">
                    <th:block th:each="pt : ${postTypes}">
                        <input type="radio" class="btn-check" name="postType" th:id="'postType-' + ${pt}"
                               th:value="${pt}" autocomplete="off"
                               th:checked="${postForm.postType != null and postForm.postType == pt}">
                        <label class="btn btn-outline-cs" th:for="'postType-' + ${pt}" th:text="${pt}"></label>
                    </th:block>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('postType')}" th:errors="*{postType}"></div>
            </div>

            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" th:field="*{title}"
                       placeholder="e.g. Blue Backpack Near Library"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" th:field="*{category}"
                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                    <option value="" disabled>Select a category</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                          placeholder="Describe the item - color, brand, distinguishing marks, contents, etc."
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="location" class="form-label">Location</label>
                    <input type="text" class="form-control" id="location" th:field="*{location}"
                           placeholder="e.g. Main Library, 2nd Floor"
                           th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="dateLostOrFound" class="form-label">Date</label>
                    <input type="date" class="form-control" id="dateLostOrFound" th:field="*{dateLostOrFound}"
                           th:classappend="${#fields.hasErrors('dateLostOrFound')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('dateLostOrFound')}" th:errors="*{dateLostOrFound}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="contactInformation" class="form-label">Contact Information</label>
                <input type="text" class="form-control" id="contactInformation" th:field="*{contactInformation}"
                       placeholder="Phone or email" th:classappend="${#fields.hasErrors('contactInformation')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('contactInformation')}" th:errors="*{contactInformation}"></div>
            </div>

            <!-- Status is only editable when editing an existing post -->
            <div class="mb-3" th:if="${postId != null}">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" th:field="*{status}">
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="image" class="form-label">
                    <span th:text="${postId != null} ? 'Replace Photo (optional)' : 'Photo (optional)'"></span>
                </label>
                <input type="file" class="form-control" id="image" name="image" accept="image/png, image/jpeg">
                <div class="form-text">JPG or PNG only, up to 5MB.</div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-cs-primary"
                        th:text="${postId != null} ? 'Save Changes' : 'Submit Report'"></button>
                <a th:href="${postId != null} ? @{'/lostfound/' + ${postId}} : @{/lostfound}"
                   class="btn btn-outline-cs">Cancel</a>
            </div>
        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
