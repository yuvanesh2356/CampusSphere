<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/marketplace.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="cs-dashboard-title mb-0">My Listings</h2>
        <div class="d-flex gap-2">
            <a href="/marketplace" class="btn btn-outline-cs">Browse Marketplace</a>
            <a href="/marketplace/create" class="btn btn-cs-primary">+ Create Listing</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="row g-4" th:if="${!listings.isEmpty()}">
        <div class="col-lg-3 col-md-4 col-sm-6" th:each="listing : ${listings}">
            <div class="mkt-card" style="cursor: default;">
                <a th:href="@{'/marketplace/' + ${listing.id}}" style="text-decoration:none; color:inherit;">
                    <img th:if="${listing.imageUrl}" class="mkt-card-image" th:src="@{${listing.imageUrl}}" alt="Listing image">
                    <div class="mkt-card-image-placeholder" th:unless="${listing.imageUrl}">No Image</div>
                    <div class="mkt-card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="mkt-card-title" th:text="${listing.title}"></div>
                            <span class="badge"
                                  th:classappend="${listing.status.name() == 'AVAILABLE'} ? 'mkt-badge-available' : (${listing.status.name() == 'RESERVED'} ? 'mkt-badge-reserved' : 'mkt-badge-sold')"
                                  th:text="${listing.status}"></span>
                        </div>
                        <div class="mkt-card-price" th:text="'₹' + ${listing.price}"></div>
                    </div>
                </a>
                <div class="mkt-card-body pt-0 d-flex gap-2">
                    <a class="btn btn-sm btn-outline-cs w-100" th:href="@{'/marketplace/' + ${listing.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/marketplace/' + ${listing.id} + '/delete'}" method="post" class="w-100"
                          onsubmit="return confirm('Delete this listing? This cannot be undone.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger w-100">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="mkt-empty-state" th:if="${listings.isEmpty()}">
        <h5>You haven't posted anything yet</h5>
        <p>Create your first listing to start selling on CampusSphere.</p>
        <a href="/marketplace/create" class="btn btn-cs-primary">Create Listing</a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
