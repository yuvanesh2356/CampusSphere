<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${listing.title} + ' - CampusSphere Marketplace'">Listing - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/marketplace.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <a href="/marketplace" class="btn btn-outline-cs btn-sm mb-3">&larr; Back to Marketplace</a>

    <div class="row g-4">
        <div class="col-lg-6">
            <img th:if="${listing.imageUrl}" class="mkt-detail-image" th:src="@{${listing.imageUrl}}" alt="Listing image">
            <div class="mkt-card-image-placeholder" style="height:420px;" th:unless="${listing.imageUrl}">No Image Provided</div>
        </div>

        <div class="col-lg-6">
            <div class="mkt-detail-panel">
                <div class="d-flex justify-content-between align-items-start">
                    <h3 th:text="${listing.title}"></h3>
                    <span class="badge"
                          th:classappend="${listing.status.name() == 'AVAILABLE'} ? 'mkt-badge-available' : (${listing.status.name() == 'RESERVED'} ? 'mkt-badge-reserved' : 'mkt-badge-sold')"
                          th:text="${listing.status}"></span>
                </div>

                <div class="mkt-card-price mb-2" th:text="'₹' + ${listing.price}"></div>
                <p class="mkt-card-meta mb-3" th:text="${listing.category} + ' · Condition: ' + ${listing.condition}"></p>

                <h6>Description</h6>
                <p th:text="${listing.description}"></p>

                <h6>Contact Information</h6>
                <p th:text="${listing.contactInfo}"></p>

                <p class="mkt-card-meta">
                    Posted on <span th:text="${#temporals.format(listing.createdAt, 'dd MMM yyyy')}"></span>
                </p>

                <div class="mkt-seller-box">
                    <strong>Seller</strong>
                    <p class="mb-0" th:text="${listing.sellerName}"></p>
                    <p class="mkt-card-meta mb-0" th:text="${listing.sellerDepartment}"></p>
                </div>

                <!-- Owner-only actions -->
                <div class="d-flex gap-2 mt-3" th:if="${listing.ownedByCurrentUser}">
                    <a class="btn btn-outline-cs" th:href="@{'/marketplace/' + ${listing.id} + '/edit'}">Edit Listing</a>
                    <form th:action="@{'/marketplace/' + ${listing.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Delete this listing? This cannot be undone.');">
                        <button type="submit" class="btn btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
