<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/marketplace.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="cs-dashboard-title mb-0">Marketplace</h2>
        <a href="/marketplace/create" class="btn btn-cs-primary">+ Create Listing</a>
    </div>
    <p class="cs-dashboard-subtitle">Buy and sell books, electronics, calculators, and academic materials with fellow students.</p>

    <!-- Flash messages from create/edit/delete redirects -->
    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <!-- Search + category filter -->
    <form class="mkt-toolbar row g-2 align-items-end" method="get" th:action="@{/marketplace}">
        <div class="col-md-6">
            <label for="keyword" class="form-label">Search</label>
            <input type="text" class="form-control" id="keyword" name="keyword"
                   placeholder="Search by title or description" th:value="${keyword}">
        </div>
        <div class="col-md-4">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" name="category">
                <option value="">All Categories</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat}"
                        th:text="${cat}"
                        th:selected="${cat == selectedCategory}"></option>
            </select>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-outline-cs w-100">Apply</button>
        </div>
    </form>

    <!-- Listing grid -->
    <div class="row g-4" th:if="${!listings.isEmpty()}">
        <div class="col-lg-3 col-md-4 col-sm-6" th:each="listing : ${listings}">
            <a class="mkt-card" th:href="@{'/marketplace/' + ${listing.id}}">
                <img th:if="${listing.imageUrl}" class="mkt-card-image" th:src="@{${listing.imageUrl}}" alt="Listing image">
                <div class="mkt-card-image-placeholder" th:unless="${listing.imageUrl}">No Image</div>
                <div class="mkt-card-body">
                    <div class="mkt-card-title" th:text="${listing.title}"></div>
                    <div class="mkt-card-price" th:text="'₹' + ${listing.price}"></div>
                    <div class="mkt-card-meta" th:text="${listing.category} + ' · ' + ${listing.condition}"></div>
                </div>
            </a>
        </div>
    </div>

    <!-- Empty state -->
    <div class="mkt-empty-state" th:if="${listings.isEmpty()}">
        <h5>No listings found</h5>
        <p>Try a different search term or category, or be the first to post one.</p>
        <a href="/marketplace/create" class="btn btn-cs-primary">Create the first listing</a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
