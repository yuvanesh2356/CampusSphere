<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${serviceId != null} ? 'Edit Service - CampusSphere' : 'Post a Service - CampusSphere'">Service Form - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/freelance.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard" style="max-width: 720px;">

    <h2 class="cs-dashboard-title" th:text="${serviceId != null} ? 'Edit Service' : 'Post a Service'"></h2>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="frl-form-card mt-3">
        <!--
          Same form posts to two different URLs depending on mode.
          enctype=multipart/form-data is required since this form
          carries an optional sample image alongside the text fields.
        -->
        <form th:action="${serviceId != null} ? @{'/freelance/' + ${serviceId} + '/edit'} : @{/freelance/create}"
              th:object="${serviceForm}" method="post" enctype="multipart/form-data" novalidate>

            <div class="mb-3">
                <label for="title" class="form-label">Service Title</label>
                <input type="text" class="form-control" id="title" th:field="*{title}"
                       placeholder="e.g. Resume Design &amp; Formatting"
                       th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" th:field="*{category}"
                        th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                    <option value="" disabled>Select a category</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                </select>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="4" th:field="*{description}"
                          placeholder="What's included, your turnaround time, and any requirements you need from the requester"
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="price" class="form-label">Price (₹)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="price" th:field="*{price}"
                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                </div>
                <div class="col-md-3 mb-3">
                    <label for="priceType" class="form-label">Price Type</label>
                    <select class="form-select" id="priceType" th:field="*{priceType}"
                            th:classappend="${#fields.hasErrors('priceType')} ? 'is-invalid'">
                        <option value="" disabled>Select</option>
                        <option value="FIXED">Fixed</option>
                        <option value="STARTING_FROM">Starting From</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('priceType')}" th:errors="*{priceType}"></div>
                </div>
                <div class="col-md-5 mb-3">
                    <label for="contactInfo" class="form-label">Contact Information</label>
                    <input type="text" class="form-control" id="contactInfo" th:field="*{contactInfo}"
                           placeholder="Phone or email" th:classappend="${#fields.hasErrors('contactInfo')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('contactInfo')}" th:errors="*{contactInfo}"></div>
                </div>
            </div>

            <!-- Availability status is only editable when editing an existing service -->
            <div class="mb-3" th:if="${serviceId != null}">
                <label for="status" class="form-label">Availability Status</label>
                <select class="form-select" id="status" th:field="*{status}">
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="sampleImage" class="form-label">
                    <span th:text="${serviceId != null} ? 'Replace Sample Image (optional)' : 'Sample Work Image (optional)'"></span>
                </label>
                <input type="file" class="form-control" id="sampleImage" name="sampleImage" accept="image/png, image/jpeg">
                <div class="form-text">JPG or PNG only, up to 5MB.</div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-cs-primary"
                        th:text="${serviceId != null} ? 'Save Changes' : 'Post Service'"></button>
                <a th:href="${serviceId != null} ? @{'/freelance/' + ${serviceId}} : @{/freelance}"
                   class="btn btn-outline-cs">Cancel</a>
            </div>
        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
