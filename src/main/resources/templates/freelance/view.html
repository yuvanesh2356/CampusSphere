<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${service.title} + ' - CampusSphere Freelance Hub'">Service - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/freelance.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <a href="/freelance" class="btn btn-outline-cs btn-sm mb-3">&larr; Back to Freelance Hub</a>

    <div class="row g-4">
        <div class="col-lg-6">
            <img th:if="${service.sampleImageUrl}" class="frl-detail-image" th:src="@{${service.sampleImageUrl}}" alt="Service sample image">
            <div class="frl-card-image-placeholder" style="height:420px;" th:unless="${service.sampleImageUrl}">No Sample Image Provided</div>
        </div>

        <div class="col-lg-6">
            <div class="frl-detail-panel">
                <div class="d-flex justify-content-between align-items-start">
                    <h3 th:text="${service.title}"></h3>
                    <span class="badge"
                          th:classappend="${service.status.name() == 'AVAILABLE'} ? 'frl-badge-available' : (${service.status.name() == 'BUSY'} ? 'frl-badge-busy' : 'frl-badge-not-accepting')"
                          th:text="${service.status}"></span>
                </div>

                <div class="frl-card-price mb-2"
                     th:text="(${service.priceType.name() == 'STARTING_FROM'} ? 'Starting from ₹' : '₹') + ${service.price}"></div>
                <p class="frl-card-meta mb-3" th:text="${service.category}"></p>

                <h6>Description</h6>
                <p th:text="${service.description}"></p>

                <h6>Contact Information</h6>
                <p th:text="${service.contactInfo}"></p>

                <p class="frl-card-meta">
                    Posted on <span th:text="${#temporals.format(service.createdAt, 'dd MMM yyyy')}"></span>
                </p>

                <div class="frl-seller-box">
                    <strong>Offered by</strong>
                    <p class="mb-0" th:text="${service.sellerName}"></p>
                    <p class="frl-card-meta mb-0" th:text="${service.sellerDepartment}"></p>
                </div>

                <!-- Owner-only actions -->
                <div class="d-flex gap-2 mt-3" th:if="${service.ownedByCurrentUser}">
                    <a class="btn btn-outline-cs" th:href="@{'/freelance/' + ${service.id} + '/edit'}">Edit Service</a>
                    <form th:action="@{'/freelance/' + ${service.id} + '/delete'}" method="post"
                          onsubmit="return confirm('Delete this service? This cannot be undone.');">
                        <button type="submit" class="btn btn-outline-danger">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
