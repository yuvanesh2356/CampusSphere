<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard" style="max-width: 720px;">

    <h2 class="cs-dashboard-title">Edit Profile</h2>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="cs-profile-card mt-3">
        <div class="d-flex align-items-center gap-3 mb-3" th:if="${currentPictureUrl}">
            <img th:src="@{${currentPictureUrl}}" class="cs-profile-avatar" alt="Current profile picture">
            <span class="cs-card-meta">Current profile picture</span>
        </div>

        <form th:action="@{/profile/edit}" th:object="${profileForm}" method="post" enctype="multipart/form-data" novalidate>

            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>

            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="department" class="form-label">Department</label>
                    <input type="text" class="form-control" id="department" th:field="*{department}"
                           th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="yearOfStudy" class="form-label">Year</label>
                    <select class="form-select" id="yearOfStudy" th:field="*{yearOfStudy}"
                            th:classappend="${#fields.hasErrors('yearOfStudy')} ? 'is-invalid'">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('yearOfStudy')}" th:errors="*{yearOfStudy}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="skills" class="form-label">Skills</label>
                <input type="text" class="form-control" id="skills" th:field="*{skills}"
                       placeholder="Comma-separated, e.g. Java, Spring Boot, Figma"
                       th:classappend="${#fields.hasErrors('skills')} ? 'is-invalid'">
                <div class="form-text">Separate each skill with a comma.</div>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('skills')}" th:errors="*{skills}"></div>
            </div>

            <div class="mb-3">
                <label for="aboutMe" class="form-label">About Me</label>
                <textarea class="form-control" id="aboutMe" rows="4" th:field="*{aboutMe}"
                          placeholder="A short bio other students will see on your profile"
                          th:classappend="${#fields.hasErrors('aboutMe')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('aboutMe')}" th:errors="*{aboutMe}"></div>
            </div>

            <div class="mb-3">
                <label for="contactDetails" class="form-label">Contact Details</label>
                <input type="text" class="form-control" id="contactDetails" th:field="*{contactDetails}"
                       placeholder="Phone, alternate email, or social handle you're comfortable sharing"
                       th:classappend="${#fields.hasErrors('contactDetails')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('contactDetails')}" th:errors="*{contactDetails}"></div>
            </div>

            <div class="mb-3">
                <label for="profilePicture" class="form-label">Profile Picture (optional)</label>
                <input type="file" class="form-control" id="profilePicture" name="profilePicture" accept="image/png, image/jpeg">
                <div class="form-text">JPG or PNG only, up to 5MB.</div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-cs-primary">Save Changes</button>
                <a href="/profile" class="btn btn-outline-cs">Cancel</a>
            </div>
        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
