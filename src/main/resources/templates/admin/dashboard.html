<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <h2 class="cs-dashboard-title">Admin Dashboard</h2>
    <p class="cs-dashboard-subtitle">Platform-wide overview and moderation tools.</p>

    <div class="row g-4 mt-1">
        <div class="col-lg-3 col-md-6">
            <div class="cs-stat-card">
                <div class="cs-stat-value" th:text="${stats.totalUsers}"></div>
                <div class="cs-stat-label">Total Users</div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="cs-stat-card">
                <div class="cs-stat-value" th:text="${stats.totalMarketplaceListings}"></div>
                <div class="cs-stat-label">Marketplace Listings</div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="cs-stat-card">
                <div class="cs-stat-value" th:text="${stats.totalFreelanceServices}"></div>
                <div class="cs-stat-label">Freelance Services</div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="cs-stat-card">
                <div class="cs-stat-value" th:text="${stats.totalGuidancePosts}"></div>
                <div class="cs-stat-label">Guidance Posts</div>
            </div>
        </div>
    </div>

    <div class="row g-4 mt-1">
        <div class="col-lg-3 col-md-6">
            <div class="cs-stat-card">
                <div class="cs-stat-value" th:text="${stats.totalLostFoundPosts}"></div>
                <div class="cs-stat-label">Lost &amp; Found Posts</div>
            </div>
        </div>
    </div>

    <div class="d-flex gap-2 mt-4">
        <a href="/admin/users" class="btn btn-cs-primary">Manage Users</a>
        <a href="/admin/content" class="btn btn-outline-cs">Moderate Content</a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
