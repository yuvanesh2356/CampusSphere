<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderate Content - CampusSphere Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="cs-dashboard-title mb-0">Moderate Content</h2>
        <a href="/admin" class="btn btn-outline-cs">&larr; Back to Admin Dashboard</a>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <!-- Module tabs -->
    <ul class="nav nav-tabs cs-admin-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeModule == 'marketplace'} ? 'active'" th:href="@{/admin/content(module='marketplace')}">
                Marketplace <span class="badge cs-badge-count" th:text="${marketplaceListings.size()}"></span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeModule == 'freelance'} ? 'active'" th:href="@{/admin/content(module='freelance')}">
                Freelance <span class="badge cs-badge-count" th:text="${freelanceServices.size()}"></span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeModule == 'guidance'} ? 'active'" th:href="@{/admin/content(module='guidance')}">
                Guidance <span class="badge cs-badge-count" th:text="${guidancePosts.size()}"></span>
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link" th:classappend="${activeModule == 'lostfound'} ? 'active'" th:href="@{/admin/content(module='lostfound')}">
                Lost &amp; Found <span class="badge cs-badge-count" th:text="${lostFoundPosts.size()}"></span>
            </a>
        </li>
    </ul>

    <!-- Marketplace tab -->
    <div th:if="${activeModule == 'marketplace'}" class="cs-admin-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Title</th><th>Seller</th><th>Category</th><th>Status</th><th>Posted</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${marketplaceListings}">
                    <td><a th:href="@{'/marketplace/' + ${item.id}}" th:text="${item.title}"></a></td>
                    <td th:text="${item.sellerName}"></td>
                    <td th:text="${item.category}"></td>
                    <td th:text="${item.status}"></td>
                    <td th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <form th:action="@{'/admin/content/marketplace/' + ${item.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Remove this listing? The owner will be notified.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${marketplaceListings.isEmpty()}"><td colspan="6" class="text-center cs-card-meta">No listings yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Freelance tab -->
    <div th:if="${activeModule == 'freelance'}" class="cs-admin-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Title</th><th>Seller</th><th>Category</th><th>Status</th><th>Posted</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${freelanceServices}">
                    <td><a th:href="@{'/freelance/' + ${item.id}}" th:text="${item.title}"></a></td>
                    <td th:text="${item.sellerName}"></td>
                    <td th:text="${item.category}"></td>
                    <td th:text="${item.status}"></td>
                    <td th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <form th:action="@{'/admin/content/freelance/' + ${item.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Remove this service? The owner will be notified.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${freelanceServices.isEmpty()}"><td colspan="6" class="text-center cs-card-meta">No services yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Guidance tab -->
    <div th:if="${activeModule == 'guidance'}" class="cs-admin-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Title</th><th>Author</th><th>Category</th><th>Status</th><th>Posted</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${guidancePosts}">
                    <td><a th:href="@{'/guidance/' + ${item.id}}" th:text="${item.title}"></a></td>
                    <td th:text="${item.authorName}"></td>
                    <td th:text="${item.category}"></td>
                    <td th:text="${item.status}"></td>
                    <td th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <form th:action="@{'/admin/content/guidance/' + ${item.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Remove this post? The author will be notified.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${guidancePosts.isEmpty()}"><td colspan="6" class="text-center cs-card-meta">No guidance posts yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Lost & Found tab -->
    <div th:if="${activeModule == 'lostfound'}" class="cs-admin-table-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                <tr><th>Title</th><th>Owner</th><th>Type</th><th>Status</th><th>Posted</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${lostFoundPosts}">
                    <td><a th:href="@{'/lostfound/' + ${item.id}}" th:text="${item.title}"></a></td>
                    <td th:text="${item.ownerName}"></td>
                    <td th:text="${item.postType}"></td>
                    <td th:text="${item.status}"></td>
                    <td th:text="${#temporals.format(item.createdAt, 'dd MMM yyyy')}"></td>
                    <td>
                        <form th:action="@{'/admin/content/lostfound/' + ${item.id} + '/delete'}" method="post"
                              onsubmit="return confirm('Remove this post? The owner will be notified.');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${lostFoundPosts.isEmpty()}"><td colspan="6" class="text-center cs-card-meta">No posts yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
