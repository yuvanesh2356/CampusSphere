<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard" style="max-width: 720px;">

    <h2 class="cs-dashboard-title">Notifications</h2>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div th:if="${!notifications.isEmpty()}">
        <div class="cs-notification-item" th:each="notif : ${notifications}" th:classappend="${notif.read} ? '' : 'cs-notification-unread'">
            <div class="d-flex justify-content-between align-items-start gap-2">
                <div>
                    <p class="mb-1" th:text="${notif.message}"></p>
                    <span class="cs-card-meta" th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy, hh:mm a')}"></span>
                </div>
                <div class="d-flex gap-2 flex-shrink-0">
                    <a th:if="${notif.link}" th:href="@{${notif.link}}" class="btn btn-sm btn-outline-cs">View</a>
                    <form th:if="${!notif.read}" th:action="@{'/notifications/' + ${notif.id} + '/read'}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-cs">Mark Read</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="cs-empty-state" th:if="${notifications.isEmpty()}">
        <h5>No notifications yet</h5>
        <p>You'll see updates here when there's something relevant to your posts.</p>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
