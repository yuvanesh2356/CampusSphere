<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Guidance Posts - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/guidance.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="cs-dashboard-title mb-0">My Guidance Posts</h2>
        <div class="d-flex gap-2">
            <a href="/guidance" class="btn btn-outline-cs">Browse Guidance Hub</a>
            <a href="/guidance/create" class="btn btn-cs-primary">+ Share Guidance</a>
        </div>
    </div>

    <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="row g-4" th:if="${!posts.isEmpty()}">
        <div class="col-lg-3 col-md-4 col-sm-6" th:each="post : ${posts}">
            <div class="gdn-card" style="cursor: default;">
                <a th:href="@{'/guidance/' + ${post.id}}" style="text-decoration:none; color:inherit;">
                    <div class="gdn-card-body">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="gdn-card-title" th:text="${post.title}"></div>
                            <span class="badge"
                                  th:classappend="${post.status.name() == 'PUBLISHED'} ? 'gdn-badge-published' : 'gdn-badge-hidden'"
                                  th:text="${post.status}"></span>
                        </div>
                        <div class="gdn-card-meta" th:text="${post.category}"></div>
                    </div>
                </a>
                <div class="gdn-card-body pt-0 d-flex gap-2">
                    <a class="btn btn-sm btn-outline-cs w-100" th:href="@{'/guidance/' + ${post.id} + '/edit'}">Edit</a>
                    <form th:action="@{'/guidance/' + ${post.id} + '/delete'}" method="post" class="w-100"
                          onsubmit="return confirm('Delete this guidance post? This cannot be undone.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger w-100">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="gdn-empty-state" th:if="${posts.isEmpty()}">
        <h5>You haven't shared any guidance yet</h5>
        <p>Share your first guidance post to help juniors on CampusSphere.</p>
        <a href="/guidance/create" class="btn btn-cs-primary">Share Guidance</a>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
