<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${opportunityId != null} ? 'Edit Opportunity - CampusSphere' : 'Post Opportunity - CampusSphere'">Opportunity Form - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/opportunity.css}">
</head>
<body>

<div class="cs-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="cs-app-main">
<div th:replace="~{fragments/topbar :: topbar}"></div>

<main class="cs-content-area cs-dashboard" style="max-width: 760px;">

    <h2 class="cs-dashboard-title" th:text="${opportunityId != null} ? 'Edit Opportunity' : 'Post a Global Opportunity'"></h2>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <div class="opp-detail-panel mt-3">
        <form th:action="${opportunityId != null} ? @{'/global/' + ${opportunityId} + '/edit'} : @{/global/create}"
              th:object="${opportunityForm}" method="post" enctype="multipart/form-data" novalidate>

            <div class="row">
                <div class="col-md-7 mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>
                <div class="col-md-5 mb-3">
                    <label for="organization" class="form-label">Organization</label>
                    <input type="text" class="form-control" id="organization" th:field="*{organization}"
                           th:classappend="${#fields.hasErrors('organization')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('organization')}" th:errors="*{organization}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" rows="5" th:field="*{description}"
                          th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select class="form-select" id="category" th:field="*{category}"
                            th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                        <option value="" disabled>Select a category</option>
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="mode" class="form-label">Mode</label>
                    <select class="form-select" id="mode" th:field="*{mode}"
                            th:classappend="${#fields.hasErrors('mode')} ? 'is-invalid'">
                        <option value="" disabled>Select a mode</option>
                        <option th:each="m : ${modes}" th:value="${m}" th:text="${m}"></option>
                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('mode')}" th:errors="*{mode}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="location" class="form-label">Location (if offline/hybrid)</label>
                    <input type="text" class="form-control" id="location" th:field="*{location}">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="eventDate" class="form-label">Event Date</label>
                    <input type="date" class="form-control" id="eventDate" th:field="*{eventDate}"
                           th:classappend="${#fields.hasErrors('eventDate')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('eventDate')}" th:errors="*{eventDate}"></div>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="registrationDeadline" class="form-label">Registration Deadline</label>
                    <input type="date" class="form-control" id="registrationDeadline" th:field="*{registrationDeadline}"
                           th:classappend="${#fields.hasErrors('registrationDeadline')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('registrationDeadline')}" th:errors="*{registrationDeadline}"></div>
                </div>
            </div>

            <div class="mb-3">
                <label for="prizeBenefits" class="form-label">Prize / Benefits</label>
                <input type="text" class="form-control" id="prizeBenefits" th:field="*{prizeBenefits}"
                       placeholder="e.g. $5,000 prize pool, internship offers, certificates">
            </div>

            <div class="mb-3">
                <label for="registrationUrl" class="form-label">Official Registration URL</label>
                <input type="url" class="form-control" id="registrationUrl" th:field="*{registrationUrl}"
                       placeholder="https://..." th:classappend="${#fields.hasErrors('registrationUrl')} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('registrationUrl')}" th:errors="*{registrationUrl}"></div>
            </div>

            <!-- Status is only editable when editing an existing opportunity -->
            <div class="mb-3" th:if="${opportunityId != null}">
                <label for="status" class="form-label">Status</label>
                <select class="form-select" id="status" th:field="*{status}">
                    <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"></option>
                </select>
            </div>

            <div class="mb-3">
                <label for="bannerImage" class="form-label">
                    <span th:text="${opportunityId != null} ? 'Replace Banner Image (optional)' : 'Banner Image (optional)'"></span>
                </label>
                <input type="file" class="form-control" id="bannerImage" name="bannerImage" accept="image/png, image/jpeg">
                <div class="form-text">JPG or PNG only, up to 5MB.</div>
            </div>

            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-cs-primary"
                        th:text="${opportunityId != null} ? 'Save Changes' : 'Post Opportunity'"></button>
                <a th:href="${opportunityId != null} ? @{'/global/' + ${opportunityId}} : @{/global}"
                   class="btn btn-outline-cs">Cancel</a>
            </div>
        </form>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
