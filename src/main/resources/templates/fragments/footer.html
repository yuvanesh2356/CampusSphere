<!DOCTYPE html>
<!-- 
  Shared footer fragment.
  Included on every page via th:replace="~{fragments/footer :: footer}"
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="cs-footer">
    <div class="container text-center">
        <p class="mb-0">&copy; <span id="csYear">2026</span> CampusSphere &mdash; Student Resource Exchange &amp; Collaboration Platform</p>
        <p class="cs-footer-sub mb-0">Built by students, for students.</p>
    </div>
</footer>
</body>
</html>
