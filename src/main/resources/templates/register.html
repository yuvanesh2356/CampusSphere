<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CampusSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container cs-auth-page">
    <div class="cs-auth-card mx-auto">
        <h2 class="cs-auth-title">Create your student account</h2>
        <p class="cs-auth-subtitle">Registration is restricted to verified college email addresses.</p>

        <div id="registerAlert" class="alert d-none" role="alert"></div>

        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" name="fullName" required>
                <div class="invalid-feedback" data-field="fullName"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">College Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@campus.edu.in" required>
                <div class="invalid-feedback" data-field="email"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" minlength="8" required>
                <div class="invalid-feedback" data-field="password"></div>
            </div>

            <div class="row">
                <div class="col-md-8 mb-3">
                    <label for="department" class="form-label">Department</label>
                    <input type="text" class="form-control" id="department" name="department" placeholder="e.g. CSE" required>
                    <div class="invalid-feedback" data-field="department"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="yearOfStudy" class="form-label">Year</label>
                    <select class="form-select" id="yearOfStudy" name="yearOfStudy" required>
                        <option value="" selected disabled>Year</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                    <div class="invalid-feedback" data-field="yearOfStudy"></div>
                </div>
            </div>

            <button type="submit" class="btn btn-cs-primary w-100 mt-2">Register</button>
        </form>

        <p class="cs-auth-footer-text">Already have an account? <a href="/login">Login here</a></p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
</body>
</html>
