# =====================================================
# CampusSphere - Application Configuration (Phase 1)
# =====================================================

# ---------------------------------------------------
# Server
# ---------------------------------------------------
server.port=8080

# ---------------------------------------------------
# MySQL Database Connection
# Update the URL, username, and password to match your local MySQL setup.
# The database "campussphere_db" must exist before starting the app
# (or enable createDatabaseIfNotExist=true as shown below).
# ---------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/campussphere_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=yuvi@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------
# JPA / Hibernate
# ddl-auto=update lets Hibernate create/update tables automatically from
# entity classes during development. Switch to "validate" once the schema
# is stable, to avoid accidental structural changes in later phases.
# ---------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------
# Thymeleaf
# Caching disabled during development so template edits are reflected
# without restarting the server. Re-enable (set to true) for production.
# ---------------------------------------------------
spring.thymeleaf.cache=false

# ---------------------------------------------------
# Application-specific settings
# Domain used by the college email validator (auth.util package).
# Update this to your actual institution's email domain.
# ---------------------------------------------------
campussphere.security.allowed-email-domain=@campus.edu.in

# ---------------------------------------------------
# File Uploads (Phase 2 - Marketplace)
# Directory is created automatically at runtime by FileStorageService.
# Kept outside the classpath so uploaded files persist across restarts
# and are not bundled into the build artifact. Reused by every future
# module that needs image upload (Freelance, Guidance, Lost & Found).
# ---------------------------------------------------
campussphere.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------
# Logging
# ---------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.campussphere=DEBUG
